<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN LASER - Official</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    
    <style>
        /* TASARIM REHBERİ */
        body { font-family: 'Times New Roman', serif; background: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; }
        .form-container { width: 790px; background: white; padding: 25px; border: 2px solid #000; box-sizing: border-box; margin-top: 20px; }
        .row { display: flex; gap: 15px; margin-top: 10px; }
        .field { flex: 1; display: flex; align-items: baseline; border-bottom: 1px solid #000; }
        .field label { font-weight: bold; margin-right: 10px; font-size: 14px; white-space: nowrap; }
        .field input { border: none; width: 100%; outline: none; font-size: 16px; background: transparent; }
        .main-layout { display: flex; margin-top: 15px; border: 2px solid #000; }
        .left-panel { flex: 2; border-right: 2px solid #000; }
        .engraving-box { background: #f9f9f9; border-bottom: 2px solid #000; padding: 8px; text-align: center; }
        .engraving-box textarea { width: 95%; height: 50px; font-size: 20px; font-weight: bold; border: none; background: transparent; resize: none; text-align: center; }
        .canvas-wrap { position: relative; height: 420px; background: #fff; overflow: hidden; }
        .font-wrap { flex: 1; padding: 10px; background: #fff; height: 480px; overflow-y: auto; }
        .font-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 14px; }
        .sig-area { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
        #sig-canvas { border-bottom: 1px solid #000; width: 180px; height: 60px; }
        .no-print { width: 100%; background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        button { padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; }

        /* TELEFONDA DOSYA SEÇİCİ DÜZELTME */
        #imgInp { -webkit-appearance: none; color: white; font-size: 12px; }

        @media screen and (max-width: 800px) {
            .form-container { width: 100% !important; padding: 10px !important; margin-top: 0; }
            .row { flex-direction: column; gap: 5px; }
            .main-layout { flex-direction: column; border: none; }
            .canvas-wrap { height: 320px; border: 1px solid #000; }
        }

        @media print {
            .no-print { display: none !important; }
            .form-container { width: 100% !important; transform: scale(0.85); transform-origin: top center; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()" style="background:white;">PRINT</button>
    <button id="saveBtn" onclick="captureAndSend()" style="background:#d32f2f; color:white;">SAVE & MAIL</button>
    <input type="file" id="imgInp" accept="image/*">
</div>

<div id="capture-area" class="form-container">
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="ICANLaser_logo.jpg" alt="I CAN LASER" style="width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto;">
    </div>

    <div class="row">
        <div class="field"><label>Customer:</label><input type="text" id="cName"></div>
        <div class="field"><label>Date:</label><input type="text" id="oDate" readonly></div>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="engraving-box">
                <textarea id="eText" oninput="updateCanvas()" placeholder="ENTER TEXT HERE"></textarea>
                <label style="font-size: 12px; font-weight: bold;">
                    <input type="checkbox" id="textColorWhite" onchange="updateCanvas()"> White Text
                </label>
            </div>
            <div class="canvas-wrap"><canvas id="c"></canvas></div>
        </div>
        <div class="font-wrap" id="fList">
            <div class="font-item" onclick="setFont('Times New Roman',this)">Times New Roman</div>
            <div class="font-item" onclick="setFont('Arial',this)">Arial</div>
            <div class="font-item" onclick="setFont('Courier New',this)">Courier New</div>
        </div>
    </div>

    <div class="sig-area">
        <div class="field"><label>Signature:</label><canvas id="sig-canvas"></canvas></div>
        <div style="text-align: right;"><label>Date:</label><input type="text" id="fDate" readonly></div>
    </div>
</div>

<script>
// Global değişkenler
let canvas, sigPad, tObj, curFont = 'Times New Roman';
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcsHgi8rlYWmSvXTB1x1HRgbFgz12VLNY1Kd3vLpAr16jwDeXbqNrU5nv4sTsPSb998w/exec";

// SAYFA YÜKLENİNCE ÇALIŞACAK ANA FONKSİYON
window.onload = function() {
    // Canvas'ı Başlat
    canvas = new fabric.Canvas('c', {
        width: document.querySelector('.canvas-wrap').clientWidth,
        height: 420
    });

    // İmza Padini Başlat
    sigPad = new SignaturePad(document.getElementById('sig-canvas'));

    // Günün Tarihini Yaz
    const bugun = new Date().toLocaleDateString('tr-TR');
    document.getElementById('oDate').value = bugun;
    document.getElementById('fDate').value = bugun;

    // RESİM YÜKLEME OLAYI
    document.getElementById('imgInp').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(f) {
            fabric.Image.fromURL(f.target.result, function(img) {
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: scale,
                    scaleY: scale,
                    left: canvas.width / 2,
                    top: canvas.height / 2,
                    originX: 'center',
                    originY: 'center'
                });
            });
        };
        reader.readAsDataURL(file);
    };
};

function updateCanvas() {
    const val = document.getElementById('eText').value;
    const color = document.getElementById('textColorWhite').checked ? '#FFFFFF' : '#000000';
    
    if (!tObj) {
        tObj = new fabric.IText(val || ' ', {
            left: canvas.width / 2,
            top: canvas.height / 2,
            originX: 'center',
            originY: 'center',
            fontSize: 40,
            fontFamily: curFont,
            fill: color
        });
        canvas.add(tObj);
    } else {
        tObj.set({ text: val, fontFamily: curFont, fill: color });
        canvas.renderAll();
    }
}

function setFont(f, el) {
    curFont = f;
    document.querySelectorAll('.font-item').forEach(x => x.style.fontWeight = 'normal');
    el.style.fontWeight = 'bold';
    if (tObj) { tObj.set('fontFamily', f); canvas.renderAll(); }
}

async function captureAndSend() {
    const btn = document.getElementById('saveBtn');
    btn.innerText = "SENDING..."; btn.disabled = true;
    try {
        const captureArea = document.getElementById('capture-area');
        const canvasImg = await html2canvas(captureArea, { useCORS: true, scale: 2 });
        const data = {
            customer: document.getElementById('cName').value,
            adminImageData: canvasImg.toDataURL("image/jpeg", 0.8),
            designOnlyPng: canvas.toDataURL("image/png")
        };
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        alert("Success!");
    } catch (err) { alert("Error: " + err); }
    btn.innerText = "SAVE & MAIL"; btn.disabled = false;
}
</script>
</body>
</html>
