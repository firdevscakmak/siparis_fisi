<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN LASER - Master v4.0 Official</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()" style="background:white;">1. ONLY PRINT</button>
    <button class="btn-save" id="saveBtn" onclick="captureAndSend()">2. SAVE & MAIL FORM</button>
    <input type="file" id="imgInp" accept="image/*">
</div>

<div id="capture-area" class="form-container">
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="ICANLaser_logo.jpg" alt="I CAN LASER" style="width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto;">
    </div>

    <div class="row">
        <div class="field" style="flex:2"><label>Customer:</label><input type="text" id="cName"></div>
        <div class="field"><label>Date:</label><input type="text" id="oDate" readonly></div>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="engraving-box">
                <textarea id="eText" oninput="updateCanvas()" placeholder="ENTER TEXT HERE"></textarea>
                <div style="text-align: right; padding-right: 10px; margin-top: -5px;">
                    <label style="font-size: 14px; font-weight: bold;">
                        <input type="checkbox" id="textColorWhite" onchange="updateCanvas()"> White Text
                    </label>
                </div>
            </div>
            <div class="canvas-wrap"><canvas id="c"></canvas></div>
        </div>
        
        <div class="font-wrap">
            <strong style="display:block; margin-bottom:10px;">SELECT FONT:</strong>
            <div id="fList">
               <div class="font-item" onclick="setFont('Times New Roman',this)">1. Times New Roman</div>
               <div class="font-item" onclick="setFont('Oregano',this)">2. Oregano</div>
               <div class="font-item" onclick="setFont('Playball',this)">3. Playball</div>
               <div class="font-item" onclick="setFont('Wished Lovely',this)">4. Wished Lovely</div>
               <div class="font-item" onclick="setFont('LCALLIG_Local',this)">5. Lucida Calligraphy</div>
               <div class="font-item" onclick="setFont('ALS Script',this)">6. ALS Script</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="field"><label>Price $:</label><input type="text" id="price"></div>
        <div class="field"><label>Pickup:</label><input type="date" id="pDate"></div>
    </div>

    <div class="sig-area">
        <div class="field"><label>Customer Signature:</label><canvas id="sig-canvas"></canvas></div>
        <div style="text-align: right; flex: 1;">
            <p style="margin:0; font-family:serif; font-size:20px; font-weight:bold;">I CAN LASER INC.</p>
            <div class="field" style="margin-top:5px;"><label>Date:</label><input type="text" id="fDate" readonly></div>
        </div>
    </div>
</div>

<script>
// Değişkenleri tanımla
let canvas, sigPad, tObj, curFont = 'Times New Roman';
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcsHgi8rlYWmSvXTB1x1HRgbFgz12VLNY1Kd3vLpAr16jwDeXbqNrU5nv4sTsPSb998w/exec";

// Tarayıcı hazır olduğunda başlat
document.addEventListener("DOMContentLoaded", function() {
    console.log("Sistem başlatılıyor...");
    
    // Canvas kurulumu
    canvas = new fabric.Canvas('c');
    canvas.setWidth(520);
    canvas.setHeight(420);
    
    // İmza kurulumu
    sigPad = new SignaturePad(document.getElementById('sig-canvas'));

    // Tarihler
    const bugun = new Date().toLocaleDateString('tr-TR');
    document.getElementById('oDate').value = bugun;
    document.getElementById('fDate').value = bugun;

    // RESİM YÜKLEME
    document.getElementById('imgInp').addEventListener('change', function(e) {
        console.log("Resim dosyası algılandı.");
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(f) {
            fabric.Image.fromURL(f.target.result, function(img) {
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: scale, scaleY: scale, left: 260, top: 210, originX: 'center', originY: 'center'
                });
                console.log("Resim yüklendi.");
            });
        };
        reader.readAsDataURL(file);
    });
});

function updateCanvas() {
    if (!canvas) return;
    const val = document.getElementById('eText').value;
    const color = document.getElementById('textColorWhite').checked ? '#FFFFFF' : '#000000';
    
    if (!tObj) {
        tObj = new fabric.IText(val || ' ', {
            left: 260, top: 210, originX: 'center', originY: 'center',
            fontSize: 40, fontFamily: curFont, fill: color, textAlign: 'center'
        });
        canvas.add(tObj);
    } else {
        tObj.set({ text: val, fontFamily: curFont, fill: color });
        canvas.renderAll();
    }
}

function setFont(f, el) {
    curFont = f;
    document.querySelectorAll('.font-item').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    if (tObj) {
        tObj.set('fontFamily', f);
        canvas.renderAll();
    } else {
        updateCanvas();
    }
}

async function captureAndSend() {
    const btn = document.getElementById('saveBtn');
    btn.innerText = "SENDING..."; btn.disabled = true;
    try {
        const captureArea = document.getElementById('capture-area');
        const canvasImg = await html2canvas(captureArea, { useCORS: true, scale: 2 });
        const data = {
            customer: document.getElementById('cName').value,
            adminImageData: canvasImg.toDataURL("image/jpeg", 0.8),
            designOnlyPng: canvas.toDataURL("image/png")
        };
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        alert("Success!");
    } catch (err) { alert("Error: " + err); }
    btn.innerText = "2. SAVE & MAIL FORM"; btn.disabled = false;
}
</script>
</body>
</html>
