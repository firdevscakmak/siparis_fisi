<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN LASER - Master v4.2</title>
    
    <script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    
    <style>
        /* Tasarım Bölümü */
        body { font-family: 'Times New Roman', serif; background: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; }
        .form-container { width: 790px; background: white; padding: 20px; border: 2px solid #000; box-sizing: border-box; margin-top: 10px; }
        .row { display: flex; gap: 10px; margin-top: 8px; }
        .field { flex: 1; display: flex; align-items: baseline; border-bottom: 1px solid #000; }
        .field label { font-weight: bold; margin-right: 5px; font-size: 13px; }
        .field input { border: none; width: 100%; outline: none; font-size: 14px; background: transparent; }
        .main-layout { display: flex; margin-top: 10px; border: 2px solid #000; }
        .left-panel { flex: 2; border-right: 2px solid #000; }
        .engraving-box { background: #f9f9f9; border-bottom: 1px solid #000; padding: 5px; text-align: center; }
        .engraving-box textarea { width: 95%; height: 40px; font-size: 18px; border: none; background: transparent; resize: none; text-align: center; font-weight: bold; }
        .canvas-wrap { position: relative; height: 350px; background: #fff; }
        .font-wrap { flex: 1; padding: 5px; background: #fff; height: 400px; overflow-y: auto; }
        .font-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 14px; }
        .font-item.selected { background: #f0f0f0; border-left: 4px solid #d32f2f; font-weight: bold; }
        .sig-area { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
        #sig-canvas { border-bottom: 1px solid #000; width: 150px; height: 50px; }
        .no-print { width: 100%; background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        button { padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; }

        @media screen and (max-width: 800px) {
            .form-container { width: 100% !important; border: none; padding: 10px; }
            .row { flex-direction: column; }
            .main-layout { flex-direction: column; }
            .canvas-wrap { height: 300px; }
        }
        @media print {
            .no-print { display: none !important; }
            .form-container { width: 100% !important; transform: scale(0.85); transform-origin: top center; }
            html, body { height: 100%; overflow: hidden; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()" style="background:white;">1. PRINT</button>
    <button onclick="captureAndSend()" id="saveBtn" style="background:#d32f2f; color:white;">2. SAVE & MAIL</button>
    <input type="file" id="imgInp" accept="image/*" style="color:white; font-size:12px;">
</div>

<div id="capture-area" class="form-container">
    <div style="text-align: center;"><img src="ICANLaser_logo.jpg" style="max-width:200px;"></div>
    
    <div class="row">
        <div class="field"><label>Customer:</label><input type="text" id="cName"></div>
        <div class="field"><label>Date:</label><input type="text" id="oDate" readonly></div>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="engraving-box">
                <textarea id="eText" oninput="updateCanvas()" placeholder="ENTER TEXT"></textarea>
                <label style="font-size:12px;"><input type="checkbox" id="textColorWhite" onchange="updateCanvas()"> White Text</label>
            </div>
            <div class="canvas-wrap"><canvas id="c"></canvas></div>
        </div>
        <div class="font-wrap" id="fList">
            <div class="font-item" onclick="setFont('Times New Roman',this)">Times New Roman</div>
            <div class="font-item" onclick="setFont('Arial',this)">Arial</div>
            <div class="font-item" onclick="setFont('Courier New',this)">Courier New</div>
            <div class="font-item" onclick="setFont('Georgia',this)">Georgia</div>
        </div>
    </div>

    <div class="sig-area">
        <div class="field"><label>Signature:</label><canvas id="sig-canvas"></canvas></div>
        <div style="text-align:right;"><p style="font-size:12px; margin:0;">I CAN LASER INC.</p></div>
    </div>
</div>

<script>
let canvas, sigPad, tObj, curFont = 'Times New Roman';
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcsHgi8rlYWmSvXTB1x1HRgbFgz12VLNY1Kd3vLpAr16jwDeXbqNrU5nv4sTsPSb998w/exec";

// Sistem Başlatma
window.onload = function() {
    canvas = new fabric.Canvas('c');
    canvas.setWidth(document.querySelector('.canvas-wrap').offsetWidth);
    canvas.setHeight(350);
    
    sigPad = new SignaturePad(document.getElementById('sig-canvas'));
    
    const bugun = new Date().toLocaleDateString('tr-TR');
    document.getElementById('oDate').value = bugun;

    // Resim Yükleme Fonksiyonu
    document.getElementById('imgInp').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function(f) {
            fabric.Image.fromURL(f.target.result, function(img) {
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: scale, scaleY: scale, left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center'
                });
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    };
};

function updateCanvas() {
    const val = document.getElementById('eText').value;
    const color = document.getElementById('textColorWhite').checked ? '#FFFFFF' : '#000000';
    if (!tObj) {
        tObj = new fabric.IText(val || ' ', { left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center', fontSize: 30, fontFamily: curFont, fill: color });
        canvas.add(tObj);
    } else {
        tObj.set({ text: val, fontFamily: curFont, fill: color });
        canvas.renderAll();
    }
}

function setFont(f, el) {
    curFont = f;
    document.querySelectorAll('.font-item').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    if (tObj) { tObj.set('fontFamily', f); canvas.renderAll(); }
}

async function captureAndSend() {
    const btn = document.getElementById('saveBtn');
    btn.innerText = "SENDING..."; btn.disabled = true;
    try {
        const captureArea = document.getElementById('capture-area');
        const canvasImg = await html2canvas(captureArea, { useCORS: true, scale: 2 });
        const data = {
            customer: document.getElementById('cName').value,
            adminImageData: canvasImg.toDataURL("image/jpeg", 0.8),
            designOnlyPng: canvas.toDataURL("image/png")
        };
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        alert("Success!");
    } catch (err) { alert("Error: " + err); }
    btn.innerText = "2. SAVE & MAIL"; btn.disabled = false;
}
</script>
</body>
</html>
